name: Keep Supabase active

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Call the data-free keep-alive RPC
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -eu
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Set the SUPABASE_URL and SUPABASE_ANON_KEY repository secrets."
            exit 1
          fi
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --request POST \
            --header "apikey: $SUPABASE_ANON_KEY" \
            --header "Authorization: Bearer $SUPABASE_ANON_KEY" \
            --header "Content-Type: application/json" \
            --data '{}' \
            "${SUPABASE_URL%/}/rest/v1/rpc/keep_alive")"
          if [ "$status" != "200" ]; then
            echo "Keep-alive request failed with HTTP ${status}."
            exit 1
          fi
          echo "Supabase keep-alive request succeeded."
